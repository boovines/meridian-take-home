name: App checks

on:
  push:
    branches: [main]
  pull_request:
    # Include stacked PRs whose base is another feature branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check repository hygiene
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            git show --format= --check HEAD
          fi
          test -f README.md
          test -f app/README.md
          test -f docs/architecture.md
          test -f docs/verification.md
          test -f CONTRIBUTING.md
          test -f AGENTS.md
          test -f .github/pull_request_template.md
  quality:
    name: Static checks and worker bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run worker:check

  tests:
    name: Test suite (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Keep both adapter results even if one suite fails.
      fail-fast: false
      matrix:
        database: [pglite, postgres]
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: ${{ matrix.database == 'postgres' && 'postgres:17' || '' }}
        env:
          POSTGRES_DB: meridian_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Run all domain, service, and Temporal cancellation tests
        run: npm test -- --reporter=default --reporter=github-actions --reporter=junit --outputFile=test-results/vitest.xml
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:postgres@127.0.0.1:5432/meridian_test' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.database }}
          path: app/test-results/vitest.xml
          retention-days: 7
          if-no-files-found: warn

  browser:
    name: Production build and browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser journeys against isolated local persistence
        run: npm run test:browser -- --reporter=github,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-and-failure-traces
          path: app/test-results/
          retention-days: 7
          if-no-files-found: warn

  # Preserve the existing required check name while exposing failures separately.
  app:
    if: always()
    needs: [quality, tests, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every application check to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          if [ "$QUALITY" != success ] || [ "$TESTS" != success ] || [ "$BROWSER" != success ]; then
            echo "Application checks did not all pass: quality=$QUALITY tests=$TESTS browser=$BROWSER"
            exit 1
          fi
